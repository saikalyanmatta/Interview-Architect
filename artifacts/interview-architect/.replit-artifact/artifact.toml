kind = "web"
previewPath = "/"
title = "Interview Architect"
version = "1.0.0"
id = "artifacts/interview-architect"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23041

[services.development]
run = "pnpm --filter @workspace/interview-architect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interview-architect", "run", "build" ]
publicDir = "artifacts/interview-architect/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23041"
BASE_PATH = "/"
